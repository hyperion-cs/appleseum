name: appleseum

services:
  appleseum:
    image: ghcr.io/hyperion-cs/appleseum:latest
    container_name: appleseum
    command: ["--public"]
    # An HTTPS reverse proxy on the host connects to this port.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - appleseum-data:/data
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  appleseum-data:
    name: appleseum-data
